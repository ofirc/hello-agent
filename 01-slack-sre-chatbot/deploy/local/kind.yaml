# The local stand-in for the GKE cluster: one node is plenty for three tiny Deployments
# plus Argo CD.
#
# Node port 30443 is where up.sh publishes argocd-server (as a NodePort). Mapping it to
# host port 8443 is what lets the agent reach Argo CD at https://localhost:8443 with no
# port-forward to babysit. Containers on kind's Docker network reach the same Service at
# https://sre-local-control-plane:30443 without this mapping.
#
# Bound to 127.0.0.1, not 0.0.0.0. The Argo CD API is behind a token, but there is no
# reason for the rest of the LAN to see it at all.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30443
        hostPort: 8443
        listenAddress: 127.0.0.1
        protocol: TCP
