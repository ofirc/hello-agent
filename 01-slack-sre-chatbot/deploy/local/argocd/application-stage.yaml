# Local kind stack application. Same as deploy/argocd/application-stage.yaml, but it
# reads gitops/overlays-local so the cloud stack is untouched.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-catalog-stage
  namespace: argocd
  labels:
    # The agent reads these two labels to map an Argo CD application back to a
    # service and an environment. Without them it falls back to splitting the
    # application name on the last hyphen.
    app.kubernetes.io/name: product-catalog
    app.kubernetes.io/part-of: stage
spec:
  project: default
  source:
    repoURL: https://github.com/ofirc/hello-agent.git
    targetRevision: main
    path: 01-slack-sre-chatbot/gitops/overlays-local/stage
  destination:
    server: https://kubernetes.default.svc
    namespace: stage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
