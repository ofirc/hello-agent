apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-catalog-prod
  namespace: argocd
  labels:
    # The agent reads these two labels to map an Argo CD application back to a
    # service and an environment. Without them it falls back to splitting the
    # application name on the last hyphen.
    app.kubernetes.io/name: product-catalog
    app.kubernetes.io/part-of: prod
spec:
  project: default
  source:
    repoURL: https://github.com/ofirc/hello-agent.git
    targetRevision: main
    path: 01-slack-sre-chatbot/gitops/overlays/prod
    # The registry lives here, not in the overlay, so the GitOps repo carries no
    # project id. 03-argocd.sh substitutes IMAGE_REPO at apply time.
    #
    # Only the image *name* is overridden. The tag still comes from the overlay's
    # newTag, which is the single line /sre drift fix edits and the single value the
    # agent compares against the cluster.
    kustomize:
      images:
        - product-catalog=IMAGE_REPO/product-catalog
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    # prod auto-syncs like the others, which is deliberate. It means the only source
    # of drift in the demo is the overlay itself lagging stage, so the scenario is
    # reproducible, and merging the agent's PR closes the loop live on stage.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        maxDuration: 2m
