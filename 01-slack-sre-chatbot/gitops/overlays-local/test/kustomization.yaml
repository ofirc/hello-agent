# Local kind stack overlay. A copy of gitops/overlays/test with one replica, so the
# cloud stack never changes with it. Keep the two trees in step by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: test

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: product-catalog
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: test
      - op: replace
        path: /spec/replicas
        value: 1
  # part-of is what the agent reads to work out which environment an Argo CD
  # application belongs to.
  - target:
      kind: Deployment
      name: product-catalog
    patch: |-
      - op: add
        path: /metadata/labels/app.kubernetes.io~1part-of
        value: test

# The SRE agent edits exactly one line in this file: the newTag below.
#
# The image is on GHCR rather than Artifact Registry so this file, which Argo CD reads
# straight from GitHub, carries no cloud project id.
#
# The registry cannot live in the Argo CD Application instead. An override there
# replaces this whole images entry rather than merging with it, which drops newTag and
# silently deploys :latest.
images:
  - name: product-catalog
    newName: ghcr.io/ofirc/product-catalog
    newTag: v1.2.0

# APP_VERSION is derived from the image tag rather than duplicated, so there is exactly
# one place to change a version and the running pod can never disagree with the tag it
# was deployed from.
replacements:
  - source:
      kind: Deployment
      name: product-catalog
      fieldPath: spec.template.spec.containers.[name=product-catalog].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: product-catalog
        fieldPaths:
          - spec.template.spec.containers.[name=product-catalog].env.[name=APP_VERSION].value
