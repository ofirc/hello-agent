apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  labels:
    app.kubernetes.io/name: product-catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: product-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-catalog
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: product-catalog
          # The tag here is a placeholder. Each overlay pins the real one via
          # kustomize images.newTag, and that is the single line the agent edits.
          image: product-catalog:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_SERVICE
              value: product-catalog
            # APP_VERSION is patched per overlay so the running pod reports the same
            # version git declares. Without this the /version endpoint would lie, and
            # the whole demo depends on being able to check the agent's answer.
            - name: APP_VERSION
              value: v0.0.0
            - name: APP_ENV
              value: unset
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: product-catalog
  labels:
    app.kubernetes.io/name: product-catalog
spec:
  selector:
    app.kubernetes.io/name: product-catalog
  ports:
    - name: http
      port: 80
      targetPort: http
